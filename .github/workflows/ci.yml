name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: avero
          POSTGRES_PASSWORD: avero_test
          POSTGRES_DB: avero_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U avero -d avero_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgresql://avero:avero_test@localhost:5432/avero_test?schema=public
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install --no-audit --no-fund
      - run: npm run db:generate
      - run: npm run db:migrate:deploy
      - run: npm test
