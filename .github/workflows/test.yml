name: Test Avero

on:
  pull_request:
    branches: [main, "feat/**", "feature/**", "fix/**", "improve/**", "skatesum/**"]
  push:
    branches: [main, "feat/**", "feature/**", "fix/**", "improve/**", "skatesum/**"]
  workflow_dispatch:

concurrency:
  group: avero-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Node.js ${{ matrix.node-version }} tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: avero
          POSTGRES_PASSWORD: avero_test
          POSTGRES_DB: avero_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U avero -d avero_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://avero:avero_test@localhost:5432/avero_test?schema=public
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24]
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Generate Prisma client
        run: npm run db:generate
      - name: Apply database migrations
        run: npm run db:migrate:deploy
      - name: Verify migration state
        run: npx prisma migrate status
      - name: Run test suite
        run: npm test
